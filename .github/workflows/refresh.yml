name: refresh
# Keeps every source up to date. Needs the repository secret DATABASE_URL (the production database).
# Scheduled updates run in production next to the API (scripts/cron/run-cycle.sh, docs/OPERATIONS.md); this workflow is for manual runs
# (e.g. a dry run or a forced refresh of one source) and needs a database the runner can reach.
on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra arguments, e.g. "--source nat-it --force" or "--dry-run"'
        required: false
        default: ''
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 1. Did any license page change? A change blocks that source until a human runs `license:ack`.
      - run: npm run check:licenses
      # 2. Refresh what is due. Exit code 1 means a source failed or needs review (see docs/OPERATIONS.md).
      - run: npm run refresh -- ${{ github.event.inputs.args || '--due' }}
      # 3. Monthly (1st of the month, or on manual runs): Wikidata QIDs/names, CLDR names/currencies, then QID links.
      #    Incremental; failures here must not hide the refresh result above, so they are reported but not fatal.
      - name: Enrich (monthly)
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run enrich:wikidata || echo "::warning::enrich:wikidata failed"
            npm run enrich:cldr || echo "::warning::enrich:cldr failed"
            npm run link || echo "::warning::link failed"
          fi
      - name: Status
        if: always()
        run: |
          psql "$DATABASE_URL" -c "select id,status,cadence,next_due_at,last_changed_at from sources order by id" || true
